name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = "github-pages";
            const maxAttempts = 10;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const artifact = data.artifacts.find(item => item.name === artifactName && !item.expired);
              if (artifact) {
                core.info(`Found ${artifactName} artifact (ID ${artifact.id}).`);
                return;
              }
              if (attempt < maxAttempts) {
                core.info(`Artifact not visible yet; retrying (${attempt}/${maxAttempts - 1}).`);
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }

            core.setFailed(`Artifact "${artifactName}" was not visible after ${maxAttempts} checks.`);
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
